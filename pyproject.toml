[project]
name = "devnexuz-rag-local"
version = "0.1.0"
description = "DevNexuz Local RAG Knowledge Engine built in Python — ingest, chunk, embed, retrieve, answer"
requires-python = ">=3.11"

dependencies = [
    "pypdf>=4.0",
    "python-docx>=1.0",
    "markdown-it-py>=3.0",
    "langchain-text-splitters>=0.2",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "ollama>=0.2",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
